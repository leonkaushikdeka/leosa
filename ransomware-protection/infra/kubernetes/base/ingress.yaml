apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: ransomware-protection-ingress
  namespace: ransomware-protection
  annotations:
    kubernetes.io/ingress.class: nginx
    nginx.ingress.kubernetes.io/ssl-redirect: "true"
    nginx.ingress.kubernetes.io/proxy-body-size: "50m"
    nginx.ingress.kubernetes.io/proxy-read-timeout: "300"
    nginx.ingress.kubernetes.io/proxy-send-timeout: "300"
spec:
  tls:
    - hosts:
        - ransomware-protection.example.com
      secretName: ransomware-protection-tls
  rules:
    - host: ransomware-protection.example.com
      http:
        paths:
          - path: /api
            pathType: Prefix
            backend:
              service:
                name: ransomware-protection-api
                port:
                  number: 8080
          - path: /
            pathType: Prefix
            backend:
              service:
                name: ransomware-protection-frontend
                port:
                  number: 80
