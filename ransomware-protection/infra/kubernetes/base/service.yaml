apiVersion: v1
kind: Service
metadata:
  name: ransomware-protection-api
  namespace: ransomware-protection
  labels:
    app.kubernetes.io/name: ransomware-protection-api
spec:
  type: ClusterIP
  ports:
    - port: 8080
      targetPort: 8080
      protocol: TCP
      name: http
    - port: 9090
      targetPort: 9090
      protocol: TCP
      name: metrics
  selector:
    app.kubernetes.io/name: ransomware-protection-api
---
apiVersion: v1
kind: Service
metadata:
  name: ransomware-protection-frontend
  namespace: ransomware-protection
  labels:
    app.kubernetes.io/name: ransomware-protection-frontend
spec:
  type: ClusterIP
  ports:
    - port: 80
      targetPort: 80
      protocol: TCP
      name: http
  selector:
    app.kubernetes.io/name: ransomware-protection-frontend
---
apiVersion: v1
kind: Service
metadata:
  name: ransomware-protection-postgres
  namespace: ransomware-protection
  labels:
    app.kubernetes.io/name: ransomware-protection-postgres
spec:
  type: ClusterIP
  ports:
    - port: 5432
      targetPort: 5432
      protocol: TCP
      name: postgres
  selector:
    app.kubernetes.io/name: ransomware-protection-postgres
---
apiVersion: v1
kind: Service
metadata:
  name: ransomware-protection-redis
  namespace: ransomware-protection
  labels:
    app.kubernetes.io/name: ransomware-protection-redis
spec:
  type: ClusterIP
  ports:
    - port: 6379
      targetPort: 6379
      protocol: TCP
      name: redis
  selector:
    app.kubernetes.io/name: ransomware-protection-redis
