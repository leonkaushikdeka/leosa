[project]
name = "ransomware-protection"
version = "1.0.0"
description = "AI-Driven Ransomware Protection for Hybrid Clouds"
readme = "README.md"
requires-python = ">=3.11"
license = {text = "MIT"}
authors = [
    {name = "Security Team", email = "security@example.com"}
]
dependencies = [
    "fastapi==0.109.0",
    "uvicorn[standard]==0.27.0",
    "pydantic==2.5.3",
    "pydantic-settings==2.1.0",
    "python-dotenv==1.0.0",
    "pyyaml==6.0.1",
    "redis==5.0.1",
    "kafka-python==2.0.2",
    "elasticsearch==8.11.1",
    "sqlalchemy==2.0.25",
    "asyncpg==0.29.0",
    "alembic==1.13.1",
    "celery[redis]==5.3.6",
    "httpx==0.26.0",
    "tenacity==8.2.3",
    "structlog==24.1.0",
    "python-json-logger==2.0.7",
    "prometheus-client==0.19.0",
    "opentelemetry-api==1.22.0",
    "opentelemetry-sdk==1.22.0",
    "cryptography==41.0.7",
    "passlib[bcrypt]==1.7.4",
    "python-jose[cryptography]==3.3.0",
]

[project.optional-dependencies]
ml = [
    "torch==2.1.2",
    "torchvision==0.16.2",
    "transformers==4.36.2",
    "scikit-learn==1.4.0",
    "xgboost==2.0.3",
    "lightgbm==4.1.0",
    "numpy==1.26.3",
    "pandas==2.1.4",
    "scipy==1.11.4",
    "mlflow==2.9.2",
    "optuna==3.5.0",
]
test = [
    "pytest==7.4.4",
    "pytest-asyncio==0.23.3",
    "pytest-cov==4.1.0",
    "httpx==0.26.0",
    "factory-boy==3.3.0",
    "faker==24.4.0",
]
dev = [
    "black==23.12.1",
    "isort==5.13.2",
    "ruff==0.1.15",
    "mypy==1.8.0",
    "pre-commit==3.6.0",
]

[tool.black]
line-length = 100
target-version = ["py311"]

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.mypy]
python_version = "3.11"
warn_return_any = true
warn_unused_configs = true
disallow_untyped_defs = true

[build-system]
requires = ["setuptools>=69.0.0", "wheel"]
build-backend = "setuptools.build_meta"
